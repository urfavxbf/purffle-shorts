name: Bakit Nga Ba - Render Short (manual, no upload)

on:
  pull_request:
    paths:
      - ".github/workflows/bakit-nga-ba-render.yml"
      - "channels/bakit-nga-ba.env"
      - "examples/bakit-nga-ba-cheaters.json"
      - "purffle_shorts/media.py"
      - "purffle_shorts/pipeline.py"
      - "purffle_shorts/visual_quality.py"
      - "tests/test_visual_quality.py"
      - "tests/test_bakit_nga_ba_profile.py"
      - "purffle_shorts/overlays.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bakit-nga-ba-render.yml"
      - "channels/bakit-nga-ba.env"
      - "examples/bakit-nga-ba-cheaters.json"
  workflow_dispatch:
    inputs:
      visual_source:
        description: "Saved Cloudflare scene art, or generate fresh Pollinations (rate-limited)"
        required: true
        type: choice
        default: local
        options:
          - local
          - pollinations
      resolution:
        description: "Vertical output resolution"
        required: true
        type: choice
        default: 1080x1920
        options:
          - 1080x1920
          - 720x1280

permissions:
  contents: read

concurrency:
  group: bakit-nga-ba-render
  cancel-in-progress: false

jobs:
  render:
    name: Tagalog 3D-look Short (export-only)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate episode and no-upload safeguards
        run: pytest -q tests/test_bakit_nga_ba_profile.py
      - name: Download and verify all 11 cinematic scene images
        if: github.event_name != 'workflow_dispatch' || inputs.visual_source == 'local'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          root = Path("media/bakit-nga-ba-cheaters")
          root.mkdir(parents=True, exist_ok=True)
          hashes = []
          base_url = "https://bakit-nga-ba-art.wordplays-transcribe.workers.dev"
          for number in range(1, 12):
              key = f"scene_{number:02d}.jpg"
              url = f"{base_url}/{key}.b64"
              errors = []
              for attempt in range(3):
                  try:
                      with urlopen(Request(url, headers={"User-Agent": "BakitNgaBaShorts/1.0"}), timeout=30) as response:
                          encoded = response.read()
                      raw = base64.b64decode(encoded, validate=True)
                      with Image.open(io.BytesIO(raw)) as image:
                          image.verify()
                      with Image.open(io.BytesIO(raw)) as image:
                          if image.width < 500 or image.height < 800:
                              raise ValueError(f"{key}: image too small: {image.size}")
                      output = root / key
                      output.write_bytes(raw)
                      digest = hashlib.sha256(raw).hexdigest()
                      hashes.append(digest)
                      print(f"{key}: {len(raw):,} bytes, sha256={digest[:12]}")
                      break
                  except (Exception,) as exc:
                      errors.append(str(exc))
                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))
              else:
                  raise RuntimeError(f"Missing artwork for {key}: {errors}")
          if len(set(hashes)) != 11:
              raise RuntimeError("Repeated storyboard image detected; refusing generic duplicate visual package.")
          print("All 11 scene artworks are valid and unique.")
          PY
      - name: Render Filipino episode (never publish)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # Layered protection: config UPLOAD=false, process UPLOAD=false, CLI --no-upload.
          UPLOAD: "false"
          KEEP_VIDEOS: "true"
        run: |
          python -m purffle_shorts make \
            --script examples/bakit-nga-ba-cheaters.json \
            --env-file channels/bakit-nga-ba.env \
            --lang fil \
            --voice fil-PH-AngeloNeural \
            --visuals "${{ inputs.visual_source || 'local' }}" \
            --resolution "${{ inputs.resolution || '1080x1920' }}" \
            --no-upload
      - name: Summarize missing artwork
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os
          paths = glob.glob("output_videos/**/visual_audit.json", recursive=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Bakit Nga Ba visual QA\n\n")
              if not paths:
                  summary.write("No visual audit generated; review the workflow logs.\n")
              for path in paths:
                  with open(path, encoding="utf-8") as file:
                      audit = json.load(file)
                  summary.write(f"**Coverage: {audit['complete_scenes']}/{audit['scene_count']} scenes**\n\n")
                  for scene in audit["scenes"]:
                      if not scene["ok"]:
                          summary.write(f"- Scene {scene['scene']}: {', '.join(scene['issues'])}\n")
          PY
      - name: Archive MP4, subtitle and metadata outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bakit-nga-ba-cheaters-short
          path: |
            output_videos/**/short.mp4
            output_videos/**/cover.jpg
            output_videos/**/captions.srt
            output_videos/**/metadata.json
            output_videos/**/script.json
            output_videos/**/visual_audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Archive missing-visuals report when render fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bakit-nga-ba-visual-audit
          path: |
            output_videos/**/visual_audit.json
            output_videos/**/script.json
          if-no-files-found: warn
          retention-days: 7
