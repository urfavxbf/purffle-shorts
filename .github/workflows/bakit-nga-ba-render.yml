name: Bakit Nga Ba - Render Short (manual, no upload)

on:
  workflow_dispatch:
    inputs:
      visual_source:
        description: "AI scene art (rate-limited), or licensed local assets already committed"
        required: true
        type: choice
        default: pollinations
        options:
          - pollinations
          - local
      resolution:
        description: "Vertical output resolution"
        required: true
        type: choice
        default: 1080x1920
        options:
          - 1080x1920
          - 720x1280

permissions:
  contents: read

concurrency:
  group: bakit-nga-ba-render
  cancel-in-progress: false

jobs:
  render:
    name: Tagalog 3D-look Short (export-only)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate episode and no-upload safeguards
        run: pytest -q tests/test_bakit_nga_ba_profile.py
      - name: Render Filipino episode (never publish)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # Layered protection: config UPLOAD=false, process UPLOAD=false, CLI --no-upload.
          UPLOAD: "false"
          KEEP_VIDEOS: "true"
        run: |
          python -m purffle_shorts make \
            --script examples/bakit-nga-ba-cheaters.json \
            --env-file channels/bakit-nga-ba.env \
            --lang fil \
            --voice fil-PH-AngeloNeural \
            --visuals "${{ inputs.visual_source }}" \
            --resolution "${{ inputs.resolution }}" \
            --no-upload
      - name: Summarize missing artwork
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os
          paths = glob.glob("output_videos/**/visual_audit.json", recursive=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Bakit Nga Ba visual QA\n\n")
              if not paths:
                  summary.write("No visual audit generated; review the workflow logs.\n")
              for path in paths:
                  with open(path, encoding="utf-8") as file:
                      audit = json.load(file)
                  summary.write(f"**Coverage: {audit['complete_scenes']}/{audit['scene_count']} scenes**\n\n")
                  for scene in audit["scenes"]:
                      if not scene["ok"]:
                          summary.write(f"- Scene {scene['scene']}: {', '.join(scene['issues'])}\n")
          PY
      - name: Archive MP4, subtitle and metadata outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bakit-nga-ba-cheaters-short
          path: |
            output_videos/**/short.mp4
            output_videos/**/cover.jpg
            output_videos/**/captions.srt
            output_videos/**/metadata.json
            output_videos/**/script.json
            output_videos/**/visual_audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Archive missing-visuals report when render fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bakit-nga-ba-visual-audit
          path: |
            output_videos/**/visual_audit.json
            output_videos/**/script.json
          if-no-files-found: warn
          retention-days: 7
